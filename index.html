<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Nigehbān — Ward Handover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400..700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%233ee7cf'/%3E%3Cstop offset='1' stop-color='%230e9c8a'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M50 8 L84 20 V50 C84 72 68 86 50 92 C32 86 16 72 16 50 V20 Z' fill='url(%23g)'/%3E%3Cpath d='M50 15 L78 24 V50 C78 68 65 80 50 85 C35 80 22 68 22 50 V24 Z' fill='%230a0f1a' opacity='0.86'/%3E%3Cpath d='M26 52 H40 L45 40 L52 62 L58 48 L62 52 H74' stroke='%233ee7cf' stroke-width='3.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0a0f1a;--card:#131c2b;--card2:#182234;--line:#233247;--line2:#2c3e57;
  --txt:#eef3fa;--dim:#9fb2ca;--mut:#657f9e;
  --teal:#34d3bd;--teal-d:#0e6b60;
  --stable:#3ed693;--watch:#f8b64c;--sick:#fb5f7c;--blue:#63a4ff;--violet:#a78bfa;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;line-height:1.4;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
.app{max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg)}

header{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,#0a0f1a,#0a0f1af2);backdrop-filter:blur(12px);padding:calc(env(safe-area-inset-top) + 10px) 14px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand h1{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.logomark{flex:0 0 auto;filter:drop-shadow(0 0 6px #34d3bd33)}
.wordmark{display:flex;align-items:baseline;gap:8px;letter-spacing:.2px}
.wm-ur{font-family:'Noto Nastaliq Urdu',serif;font-size:14px;color:var(--teal);font-weight:500;line-height:1;transform:translateY(1px)}
.hstat{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--dim)}
.sync{display:flex;align-items:center;gap:5px}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--mut)}
.sdot.live{background:var(--stable);box-shadow:0 0 6px var(--stable)}
.sdot.demo{background:var(--watch)}
.sdot.err{background:var(--sick)}

.bays{display:flex;gap:5px;overflow-x:auto;padding:10px 0 9px;scrollbar-width:none}
.bays::-webkit-scrollbar{display:none}
.bay{flex:0 0 auto;padding:6px 11px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:12.5px;color:var(--dim);font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;transition:.15s;white-space:nowrap}
.bay .n{font-size:10.5px;background:#00000055;padding:0 6px;border-radius:8px;font-weight:700;line-height:16px}
.bay.sel{background:var(--teal-d);border-color:var(--teal);color:#eafffb}
.bay.sel .n{background:#00000030;color:#eafffb}
.bay .dot{width:6px;height:6px;border-radius:50%;background:var(--sick)}
.bay .duty{font-size:9px;font-weight:800;background:#0e2c3a;color:#5fe0b0;padding:0 5px;border-radius:8px;line-height:15px;display:flex;align-items:center;gap:2px}
.dutybar{max-width:460px;margin:0 auto;padding:0 14px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px;margin-bottom:2px;min-height:0}
.dutybar:empty{display:none}
.dutybar .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);font-weight:700;margin-right:2px}
.duty-chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--dim)}
.duty-chip .rd{width:6px;height:6px;border-radius:50%}
.duty-chip.consultant .rd{background:var(--violet)}
.duty-chip.trainee .rd{background:var(--blue)}
.duty-chip.me{border-color:var(--teal);background:#0e2b28;color:#a9f0e4}
.dutybar .none{font-size:11.5px;color:var(--mut)}
.sbarhist{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:7px;font-size:12.5px}
.sh-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sh-field{font-weight:700;color:var(--teal);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
.sh-old{color:var(--mut);text-decoration:line-through;text-decoration-color:#5a3a44;margin-bottom:3px}
.sh-new{color:var(--txt)}
.sh-tag{font-size:9px;font-weight:800;padding:1px 5px;border-radius:5px;margin-right:5px;letter-spacing:.4px}
.sh-old .sh-tag{background:#3a1820;color:#e58aa0}
.sh-new .sh-tag{background:#123a2a;color:#7be0b0}
.summary-btn{width:100%;background:linear-gradient(90deg,#12332c,#152538);border:1px solid #1f5346;color:#8fe9c4;border-radius:11px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;letter-spacing:.2px}
.summary-btn:active{transform:scale(.99)}
.sum-sec{margin-bottom:14px}
.sum-h{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin-bottom:7px;display:flex;justify-content:space-between}
.sum-h b{color:var(--teal)}
.sum-item{display:flex;gap:8px;padding:7px 10px;background:var(--card2);border:1px solid var(--line);border-radius:9px;margin-bottom:5px;font-size:12.5px;align-items:flex-start}
.sum-item .dot2{flex:0 0 7px;width:7px;height:7px;border-radius:50%;margin-top:4px}
.sum-item .body2{flex:1;min-width:0}
.sum-item .nm2{font-weight:600}
.sum-item .meta2{font-size:10.5px;color:var(--mut);margin-top:1px}
.sum-empty{color:var(--mut);font-size:12px;padding:4px 2px}
.line.recur{background:#111f2e;border-color:#1c3350}
.recur-ic{flex:0 0 auto;color:var(--blue);font-weight:800;font-size:14px}
.freq{font-size:9.5px;font-weight:700;color:var(--blue);background:#0e2436;padding:1px 5px;border-radius:5px;margin-left:4px}
.due{flex:0 0 auto;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:7px;cursor:pointer;letter-spacing:.2px}
.due-ok{background:#123a2a;color:#7be0b0}
.due-soon{background:#3a2c08;color:#f8d27a}
.due-over{background:#3a0f18;color:#fb8fa3}
.due-none{background:#1c2432;color:#8aa}

.filters{display:flex;gap:6px;overflow-x:auto;padding:0 14px 10px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-size:11.5px;padding:5px 10px;border-radius:16px;background:var(--card);border:1px solid var(--line);color:var(--mut);cursor:pointer;font-weight:600}
.chip.on{background:#1a2c44;color:var(--txt);border-color:#31517a}
.chip .c{color:var(--sick);font-weight:800}

main{flex:1;padding:2px 12px 92px}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden;transition:border-color .15s}
.card.open{border-color:var(--line2)}
.head{display:grid;grid-template-columns:4px 1fr auto;cursor:pointer}
.rail{width:4px}
.card.stable .rail{background:var(--stable)}.card.watch .rail{background:var(--watch)}.card.sick .rail{background:var(--sick)}
.hmid{padding:10px 4px 10px 11px;min-width:0}
.l1{display:flex;align-items:center;gap:7px}
.name{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bed{font-size:10px;color:var(--mut);font-weight:700;background:#00000044;padding:1px 6px;border-radius:6px;flex:0 0 auto}
.age{font-size:11px;color:var(--mut);flex:0 0 auto}
.l2{display:flex;align-items:center;gap:6px;margin-top:3px;min-width:0}
.dx{font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.flags{display:flex;gap:5px;flex:0 0 auto}
.fl{font-size:10px;font-weight:800;min-width:20px;height:18px;padding:0 4px;border-radius:6px;display:grid;place-items:center}
.fl.abx{background:#3a2408;color:#f8b64c}.fl.o2{background:#0a2c3d;color:#63c8f0}
.fl.lab{background:#2b1030;color:#e28df0}.fl.esc{background:#3a0f18;color:#fb8fa3}
.fl.shift{background:#0c2e22;color:#5fe0b0}
.hend{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 12px;border-left:1px solid var(--line)}
.news{font-size:20px;font-weight:800;line-height:1;font-family:'JetBrains Mono',monospace}
.card.stable .news{color:var(--stable)}.card.watch .news{color:var(--watch)}.card.sick .news{color:var(--sick)}
.newsl{font-size:8px;color:var(--mut);letter-spacing:.6px;margin-top:2px}

.body{display:none;padding:0 12px 12px}
.card.open .body{display:block;animation:fd .18s ease}
@keyframes fd{from{opacity:0}to{opacity:1}}
.divider{height:1px;background:var(--line);margin:2px 0 11px}
.escplan{display:flex;align-items:center;gap:8px;background:linear-gradient(90deg,#2a0e15,#1f0c12);border:1px solid #5a1f2d;border-radius:10px;padding:8px 10px;margin-bottom:11px;font-size:12px}
.escplan .k{color:#ff9aab;font-weight:700;flex:1}.escplan .k b{color:#fff}
.escplan .call{background:var(--sick);color:#2a0009;font-weight:800;font-size:10.5px;padding:2px 8px;border-radius:7px;white-space:nowrap}
.escplan .x{color:#8a5563;font-size:16px;cursor:pointer;padding:0 2px}
.vitals{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:12px}
.v{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:6px 2px;text-align:center}
.v .vv{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13.5px}
.v .vl{font-size:8px;color:var(--mut);margin-top:1px;text-transform:uppercase}
.v.warn .vv{color:var(--watch)}.v.bad .vv{color:var(--sick)}
.sbar{margin-bottom:13px}
.srow{display:flex;gap:8px;padding:5px 0}
.srow+.srow{border-top:1px dashed var(--line)}
.stag{flex:0 0 18px;height:18px;border-radius:5px;font-size:10px;font-weight:800;display:grid;place-items:center;color:#06121e}
.tS{background:var(--blue)}.tB{background:var(--violet)}.tA{background:var(--watch)}.tR{background:var(--stable)}
.stxt{flex:1;font-size:12.5px;color:var(--dim)}.stxt b{color:var(--txt);font-weight:600}
.sec{margin-bottom:12px}
.sech{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin-bottom:6px;display:flex;justify-content:space-between}
.sech em{color:var(--teal);font-style:normal;font-weight:700}
.ladder{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:11.5px}
.rung{padding:3px 8px;border-radius:7px;font-weight:600}
.rung.past{background:#1c2432;color:#61728a;text-decoration:line-through}
.rung.now{background:#3a2408;color:#f8b64c;border:1px solid #6b430f}
.rung.none{background:#14251b;color:#7bbf9a}
.arr{color:var(--mut);font-size:11px}.esctag{color:var(--sick);font-weight:800;font-size:11px}
.line{display:flex;align-items:center;gap:8px;padding:6px 9px;background:var(--card2);border:1px solid var(--line);border-radius:9px;margin-bottom:5px;font-size:12.5px}
.tick{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--mut);flex:0 0 auto;display:grid;place-items:center;font-size:11px;color:transparent;cursor:pointer;transition:.12s}
.tick.done{background:var(--stable);border-color:var(--stable);color:#06121e}
.line.done .lt{text-decoration:line-through;color:var(--mut)}
.lt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.owner{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:6px;background:#1a2c44;color:#9dc0ef;flex:0 0 auto}
.when{font-size:10.5px;color:var(--mut);font-family:'JetBrains Mono',monospace;flex:0 0 auto}
.follow{color:var(--watch);font-size:10px;font-weight:800;flex:0 0 auto}
.result{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:6px;background:#123a2a;color:#7be0b0;flex:0 0 auto}
.qadd{display:flex;gap:6px;margin-top:5px}
.qadd input{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:9px;color:var(--txt);padding:7px 10px;font-size:12.5px;font-family:inherit}
.qadd input:focus{outline:none;border-color:var(--teal)}
.qadd button{flex:0 0 auto;background:var(--teal-d);border:1px solid var(--teal);color:#eafffb;border-radius:9px;padding:0 12px;font-weight:700;font-size:12.5px;cursor:pointer}
.note{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:6px 10px;margin-bottom:5px;font-size:12px}
.note .nm{color:var(--dim)}.note .nt{font-size:9.5px;color:var(--mut);font-family:'JetBrains Mono',monospace;margin-top:2px}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.act{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 2px;text-align:center;font-size:10px;color:var(--dim);cursor:pointer;font-weight:600;transition:.12s}
.act .ai{font-size:15px;display:block;margin-bottom:2px}
.act:active{background:#1a2c44;transform:scale(.97)}

.fab{position:fixed;bottom:calc(70px + env(safe-area-inset-bottom));z-index:45;right:16px}
@media(min-width:480px){.fab{right:calc(50% - 230px + 16px)}}
.fab button{width:52px;height:52px;border-radius:17px;border:none;background:var(--teal);color:#04231d;font-size:24px;font-weight:700;box-shadow:0 6px 20px #34d3bd44;cursor:pointer}
nav{position:fixed;bottom:0;left:0;right:0;z-index:44;background:#0a0f1af5;backdrop-filter:blur(12px);border-top:1px solid var(--line);max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding:7px 0 calc(6px + env(safe-area-inset-bottom))}
nav a{text-align:center;font-size:9.5px;color:var(--mut);text-decoration:none;font-weight:600;display:flex;flex-direction:column;gap:2px;align-items:center;cursor:pointer}
nav a .ni{font-size:17px}nav a.on{color:var(--teal)}

.scrim{position:fixed;inset:0;background:#000b;z-index:60;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.scrim.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:460px;border-radius:20px 20px 0 0;border:1px solid var(--line);border-bottom:0;padding:6px 14px calc(18px + env(safe-area-inset-bottom));max-height:86vh;overflow:auto;animation:up .24s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.grab{width:36px;height:4px;background:#33465e;border-radius:3px;margin:5px auto 12px}
.sheet h3{font-size:16px;margin-bottom:3px}
.sheet .sub{color:var(--mut);font-size:12px;margin-bottom:13px}.sheet .sub b{color:var(--dim)}
.field{margin-bottom:11px}
.field label{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);display:block;margin-bottom:6px}
.field select,.field input,.field textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:10px 11px;font-size:13.5px;font-family:inherit}
.field textarea{min-height:56px;resize:vertical}
.field :focus{outline:none;border-color:var(--teal)}
.pillrow{display:flex;gap:6px;flex-wrap:wrap}
.pill{padding:7px 12px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:12.5px;color:var(--dim);cursor:pointer;font-weight:600}
.pill.sel{background:var(--teal-d);border-color:var(--teal);color:#eafffb}
.go{width:100%;margin-top:6px;background:var(--teal);color:#04231d;border:none;border-radius:12px;padding:13px;font-size:14.5px;font-weight:700;cursor:pointer}
.go.ghost{background:transparent;border:1px solid var(--line);color:var(--dim)}
.go.danger{background:transparent;border:1px solid #5a1f2d;color:var(--sick)}
.arrow-move{display:flex;align-items:center;gap:9px;justify-content:center;margin:4px 0 12px;font-size:14px;font-weight:700}
.arrow-move .to{color:var(--teal)}.arrow-move .from{color:var(--mut)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:118px;background:#0d3226;border:1px solid #1c6b50;color:#8fe9c4;padding:10px 16px;border-radius:11px;font-size:12.5px;font-weight:600;z-index:80;opacity:0;transition:.3s;pointer-events:none;max-width:88%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-5px)}
.toast.bad{background:#331015;border-color:#6b1c2c;color:#f8a}
.empty{text-align:center;color:var(--mut);padding:44px 20px;font-size:13px}

.gate{position:fixed;inset:0;z-index:90;background:radial-gradient(120% 80% at 50% 0%, #10202e 0%, var(--bg) 60%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.gate-logo{margin-bottom:10px;filter:drop-shadow(0 4px 20px #34d3bd33)}
.gate-ur{font-family:'Noto Nastaliq Urdu',serif;font-size:30px;color:var(--teal);line-height:1.7;margin-bottom:2px}
.gate h2{font-size:22px;margin-bottom:4px;letter-spacing:.3px}
.gate p{color:var(--mut);font-size:13px;margin-bottom:22px;max-width:280px}
.gate input{width:100%;max-width:280px;background:var(--card2);border:1px solid var(--line);border-radius:12px;color:var(--txt);padding:13px;font-size:15px;text-align:center;margin-bottom:10px}
.gate input:focus{outline:none;border-color:var(--teal)}
.gate button{width:100%;max-width:280px;background:var(--teal);color:#04231d;border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:700;cursor:pointer}
.gate .hint{margin-top:16px;font-size:11px;color:var(--mut)}
.gate .gateswap{margin-top:14px;font-size:12.5px;color:var(--mut)}
.gate .gateswap a{color:var(--teal);font-weight:600;cursor:pointer}
.gate input{margin-bottom:10px}
.banner{background:#2a1e08;border-bottom:1px solid #5a4410;color:#f8d27a;font-size:11.5px;text-align:center;padding:6px 12px}
.logrow{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.logrow:last-child{border-bottom:0}
.logdot{flex:0 0 8px;width:8px;height:8px;border-radius:50%;margin-top:4px}
.logdot.ins{background:var(--stable)}.logdot.upd{background:var(--blue)}.logdot.del{background:var(--sick)}
.logbody{flex:1;min-width:0}
.logtop{display:flex;justify-content:space-between;gap:8px}
.logpt{font-weight:700;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logat{font-size:10px;color:var(--mut);font-family:'JetBrains Mono',monospace;flex:0 0 auto}
.logdet{color:var(--dim);margin-top:1px}
.logby{font-size:10px;color:var(--mut);margin-top:2px}
.logby b{color:#9dc0ef}
.logfilters{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.vgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.vin{display:flex;flex-direction:column}
.vin label{font-size:9px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);margin-bottom:4px;text-align:center}
.vin input{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:9px;color:var(--txt);padding:9px 4px;font-size:15px;text-align:center;font-family:'JetBrains Mono',monospace}
.vin input:focus{outline:none;border-color:var(--teal)}
.row2{display:block}
.scorepreview{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13px;margin-top:4px}
.sp-badge{font-weight:800;font-family:'JetBrains Mono',monospace;padding:2px 9px;border-radius:7px}
.sp-stable{background:#123a2a;color:#7be0b0}.sp-watch{background:#3a2c08;color:#f8d27a}.sp-sick{background:#3a0f18;color:#fb8fa3}
.sp-mut{color:var(--mut)}

/* ============ SHIFT ============ */
function currentShift(){
  const h=new Date().getHours();
  if(h>=7 && h<15) return 'Morning';
  if(h>=15 && h<21) return 'Evening';
  return 'Night';
}

// small-hours part (00:00–07:00) belongs to the previous day's Night.
function shiftDate(){
  const now=new Date(); const h=now.getHours(); const d=new Date(now);
  if(h<7){ d.setDate(d.getDate()-1); }
  return d.toISOString().slice(0,10); // YYYY-MM-DD
}

/* ============ SCORING ENGINE ============
   Reference implementations of common PEWS (age-banded) and NEWS2 charts.
   Thresholds vary by hospital — VALIDATE against your unit's own chart
   before any clinical use. Each parameter contributes 0–3; total is summed.
*/
const PEWS_BANDS = {
  // age_band : { hr, rr, spo2, temp } — each [[min,max,score]...], first match wins.
  // NOTE: reference values only — VALIDATE against your unit's own PEWS chart.
  neonate:{ hr:[[0,79,3],[80,99,1],[100,180,0],[181,200,1],[201,999,3]],
            rr:[[0,19,3],[20,29,1],[30,60,0],[61,70,1],[71,999,3]],
            spo2:[[0,84,3],[85,89,2],[90,93,1],[94,100,0]],
            temp:[[0,35.9,2],[36,37.4,0],[37.5,37.9,1],[38,99,2]] },
  infant: { hr:[[0,79,3],[80,99,1],[100,160,0],[161,180,1],[181,999,3]],
            rr:[[0,19,3],[20,24,1],[25,50,0],[51,60,1],[61,999,3]],
            spo2:[[0,84,3],[85,89,2],[90,93,1],[94,100,0]],
            temp:[[0,35.9,2],[36,37.9,0],[38,38.9,1],[39,99,2]] },
  child:  { hr:[[0,69,3],[70,79,1],[80,130,0],[131,150,1],[151,999,3]],
            rr:[[0,14,3],[15,19,1],[20,30,0],[31,40,1],[41,999,3]],
            spo2:[[0,89,3],[90,93,1],[94,100,0]],
            temp:[[0,35.9,1],[36,37.9,0],[38,38.9,1],[39,99,2]] },
  older:  { hr:[[0,49,3],[50,59,1],[60,110,0],[111,130,1],[131,999,3]],
            rr:[[0,8,3],[9,11,1],[12,20,0],[21,30,1],[31,999,3]],
            spo2:[[0,91,3],[92,93,2],[94,95,1],[96,100,0]],
            temp:[[0,35,3],[35.1,36,1],[36.1,38,0],[38.1,39,1],[39.1,99,2]] },
};
function rangeScore(table,val){ if(val==null||val===''||!table)return 0; for(const[a,b,s]of table){ if(val>=a&&val<=b)return s;} return 0; }
function bandOf(p){ return PEWS_BANDS[p.age_band]||PEWS_BANDS.child; }
function pewsScore(p){
  const band=bandOf(p);
  let s=0; const parts={};
  parts.hr=rangeScore(band.hr,p.v_hr); s+=parts.hr;
  parts.rr=rangeScore(band.rr,p.v_rr); s+=parts.rr;
  parts.spo2=rangeScore(band.spo2,p.v_spo2); s+=parts.spo2;   // now age-banded
  if(p.v_o2)s+=1; parts.o2=p.v_o2?1:0;                        // supplemental O2 adds 1
  parts.temp=rangeScore(band.temp,p.v_temp); s+=parts.temp;   // now age-banded
  const eff={normal:0,mild:1,moderate:2,severe:3}[p.v_effort]||0; parts.effort=eff; s+=eff;
  const beh={A:0,V:1,P:2,U:3}[p.v_avpu]||0; parts.avpu=beh; s+=beh;
  return {total:s,parts};
}
function news2Score(p){
  let s=0; const parts={};
  // RR
  let rr=0; const r=p.v_rr; if(r!=null){ if(r<=8)rr=3; else if(r<=11)rr=1; else if(r<=20)rr=0; else if(r<=24)rr=2; else rr=3; } parts.rr=rr; s+=rr;
  // SpO2 (scale 1)
  let sp=0; const o=p.v_spo2; if(o!=null){ if(o<=91)sp=3; else if(o<=93)sp=2; else if(o<=95)sp=1; else sp=0; } parts.spo2=sp; s+=sp;
  if(p.v_o2){ s+=2; parts.o2=2; } else parts.o2=0;
  // Temp
  let t=0; const T=p.v_temp; if(T!=null){ if(T<=35)t=3; else if(T<=36)t=1; else if(T<=38)t=0; else if(T<=39)t=1; else t=2; } parts.temp=t; s+=t;
  // HR
  let h=0; const H=p.v_hr; if(H!=null){ if(H<=40)h=3; else if(H<=50)h=1; else if(H<=90)h=0; else if(H<=110)h=1; else if(H<=130)h=2; else h=3; } parts.hr=h; s+=h;
  // consciousness (AVPU: anything below A = 3)
  const c=(p.v_avpu&&p.v_avpu!=='A')?3:0; parts.avpu=c; s+=c;
  return {total:s,parts};
}
function computeScore(p){ return p.score_system==='NEWS'?news2Score(p):pewsScore(p); }

/* ===== SBAR field helpers ===== */
const SBAR_HINT={
  s:{ph:'What’s happening right now — one line. e.g. "3yo, septic shock, ventilated, on noradrenaline"',
      chips:['Stable, comfortable','On O₂ ','On CPAP/HFNC','Ventilated & sedated','On inotrope ','Awaiting review']},
  b:{ph:'Relevant history / context. e.g. "D2 admission, cultures sent, no PMH"',
      chips:['Day of illness: ','Cultures sent','No significant PMH','Known ','Recent contact','Immunisations UTD']},
  a:{ph:'Your clinical judgement — how you read it. e.g. "Perfusion improving, lactate trending down"',
      chips:['Improving','Stable','Deteriorating','Responding to treatment','Not improving as expected','Awaiting investigations']},
  r:{ph:'What the next doctor should DO + when to worry. e.g. "Wean inotrope if MAP holds; repeat lactate 2-hrly"',
      chips:['Continue current plan','Review on round','Chase results','Wean support','Escalate if worsens','Plan discharge']},
};
function sbarField(letter,label,id,val,required){
  const h=SBAR_HINT[letter];
  const chips=h.chips.map(c=>`<span class="sbar-chip" data-for="${id}">${c}</span>`).join('');
  return `<div class="field"><label>${label}${required?'':' <span class="opt">optional</span>'}</label>
    <textarea id="${id}" placeholder="${h.ph.replace(/"/g,'&quot;')}">${(val||'').replace(/</g,'&lt;')}</textarea>
    <div class="sbar-chips">${chips}</div></div>`;
}
// wire chips: clicking appends the chip text to its textarea
function wireSbarChips(scope){
  (scope||document).querySelectorAll('.sbar-chip').forEach(ch=>ch.onclick=()=>{
    const ta=document.getElementById(ch.dataset.for); if(!ta)return;
    const t=ch.textContent; ta.value=(ta.value?ta.value.replace(/\s*$/,'')+ (ta.value.trim().endsWith(',')||ta.value.trim()===''?' ':'; '):'')+t;
    ta.focus();
  });
}
function scoreBand(sys,total){
  if(sys==='NEWS'){ if(total>=7)return 'sick'; if(total>=5)return 'watch'; return 'stable'; }
  if(total>=7)return 'sick'; if(total>=4)return 'watch'; return 'stable'; // PEWS
}
// recompute NEWS field + acuity from vitals when auto is on
function recalc(p){
  if(p.score_auto){
    const r=computeScore(p);
    p.news=r.total;
    p.sev=scoreBand(p.score_system,r.total);
  }
  // keep the display vitals array in sync so the strip shows live numbers
  p.vitals=[
    ['HR', p.v_hr??'—', hrFlag(p)],
    ['RR', p.v_rr??'—', rrFlag(p)],
    ['SpO₂', p.v_spo2??'—', vFlag(bandOf(p).spo2,p.v_spo2)],
    ['Temp', p.v_temp??'—', vFlag(bandOf(p).temp,p.v_temp)],
    ['AVPU', p.v_avpu||'A', (p.v_avpu&&p.v_avpu!=='A')?'bad':'ok'],
  ];
}
function vFlag(tbl,val){const s=rangeScore(tbl,val);return s>=3?'bad':s>=1?'warn':'ok';}function hrFlag(p){const s=rangeScore(bandOf(p).hr,p.v_hr);return s>=3?'bad':s>=1?'warn':'ok';}
function rrFlag(p){const s=rangeScore(bandOf(p).rr,p.v_rr);return s>=3?'bad':s>=1?'warn':'ok';}


async function boot(){
  if(db){
    try{
      const {data,error}=await db.from('patients').select('*').order('news',{ascending:false});
      if(error)throw error;
      P=data.map(normalize); P.forEach(recalc); MODE='live';
      setSync('live','Live · synced');
      await loadCheckins();
      try{ const {data:ws}=await db.from('ward_settings').select('*').eq('id',1).single(); WARD_GEO=ws||null; }catch(e){ WARD_GEO=null; }
      subscribeRealtime();
    }catch(e){
      console.error(e); MODE='demo'; P=DEMO.map(x=>({...x})); P.forEach(recalc);
      setSync('err','Connection failed — offline');
      showBanner('Could not load ward data. Check that schema.sql + auth.sql ran. Showing demo data.');
    }
  }else{
    MODE='demo'; P=DEMO.map(x=>({...x})); P.forEach(recalc);
    CHECKINS=DEMO_CHECKINS.slice();
    setSync('demo','Demo mode — not saving');
    showBanner('Demo mode: paste your Supabase URL + anon key in the CONFIG block to go live.');
  }
  renderBays(); renderList(); renderShift(); renderDuty(); applyLayout();
  // if geo-gating is on, get a position quietly so the far-from-ward warning can show
  if(WARD_GEO && WARD_GEO.geo_gate && WARD_GEO.lat!=null){
    getPos().then(pos=>{ if(pos) renderList(); });
  }
}
function applyLayout(){
  const nav=document.querySelector('nav'); const brand=document.querySelector('header .brand');
  if(!nav||!brand)return;
  const wide=window.innerWidth>=900;
  if(wide && nav.parentElement!==brand){
    nav.classList.add('deskbar'); brand.appendChild(nav);
  }else if(!wide && nav.parentElement===brand){
    nav.classList.remove('deskbar'); document.querySelector('.app').appendChild(nav);
  }
}
window.addEventListener('resize',()=>{ clearTimeout(window._lt); window._lt=setTimeout(applyLayout,150); });
async function loadCheckins(){
  if(MODE!=='live')return;
  try{
    // clear anything left over from a previous shift, then load current
    await db.rpc('expire_old_shift',{p_shift_tag:currentShift(),p_shift_date:shiftDate()});
    const {data}=await db.from('checkins').select('*').eq('active',true); CHECKINS=data||[];
  }catch(e){ CHECKINS=[]; }
}
let rtChannel=null, rtRetries=0, rtTimer=null;
function subscribeRealtime(){
  if(!db) return;
  if(rtChannel){ try{db.removeChannel(rtChannel);}catch(e){} rtChannel=null; }
  rtChannel = db.channel('ward-live-'+Date.now())
    .on('postgres_changes',{event:'*',schema:'public',table:'patients'},payload=>applyChange(payload))
    .on('postgres_changes',{event:'*',schema:'public',table:'checkins'},()=>{ loadCheckins().then(()=>{ renderBays(); renderList(); renderDuty(); }); })
    .subscribe(st=>{
      if(st==='SUBSCRIBED'){ rtRetries=0; if(MODE==='live')setSync('live','Live · synced'); }
      else if(st==='CHANNEL_ERROR' || st==='TIMED_OUT' || st==='CLOSED'){
        if(MODE!=='live') return;
        setSync('err','Reconnecting…');
        clearTimeout(rtTimer);
        const delay=Math.min(30000, 1500*Math.pow(1.6,rtRetries++)); // backoff, capped 30s
        rtTimer=setTimeout(subscribeRealtime, delay);
      }
    });
}
// re-check the connection when the tab comes back to the foreground (phones sleep sockets)
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && MODE==='live') subscribeRealtime(); });

function applyChange(payload){
  const {eventType,new:nu,old:od}=payload;
  const openId=currentOpenId();
  if(eventType==='INSERT'){ if(!P.find(x=>x.id===nu.id))P.push(normalize(nu)); }
  else if(eventType==='UPDATE'){ const i=P.findIndex(x=>x.id===nu.id); if(i>-1)P[i]=normalize(nu); else P.push(normalize(nu)); }
  else if(eventType==='DELETE'){ P=P.filter(x=>x.id!==od.id); }
  renderBays(); renderList(); if(openId)reopen(openId);
}
async function save(p){
  if(MODE!=='live')return;

  if(error)toast('Save failed: '+error.message,true);
}
async function insertPatient(p){
  if(MODE!=='live'){ p.id=Date.now(); P.push(p); renderBays(); renderList(); return; }
  const {data,error}=await db.from('patients').insert(toRow(p)).select().single();
  if(error){ toast('Add failed: '+error.message,true); return; }
  if(!P.find(x=>x.id===data.id))P.push(normalize(data));
  renderBays(); renderList();

// Access decision for editing a patient in a given bay.
// Returns {ok:true} | {ok:false,reason} | {ok:true,override:true} for PICU-into-other-bay.
function editAccess(patientBay){
  if(ROLE==='consultant') return {ok:true};                 // ward-wide
  const ci = myActiveCheckin();
  if(!ci) return {ok:false, reason:'You are not checked in. Check into a bay first (Me tab).'};
  if(ci.bay===patientBay) return {ok:true};                 // own bay
  if(ci.bay==='picu') return {ok:true, override:true};      // PICU trainee may override other bays
  return {ok:false, reason:`You are checked into ${BAYS.find(b=>b.id===ci.bay)?.name||ci.bay}, not ${BAYS.find(b=>b.id===patientBay)?.name||patientBay}. Only PICU or the consultant can edit other bays.`};
}

// recurring / continuous tasks
function fmtDue(t){
  if(!t.last)return {txt:'not started',cls:'due-none'};
  const last=new Date(t.last); const next=new Date(last.getTime()+(t.freq||4)*3600000);
  const mins=Math.round((next-Date.now())/60000);
  const hhmm=next.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  if(mins<0)return {txt:'DUE (was '+hhmm+')',cls:'due-over'};
  if(mins<30)return {txt:'due '+hhmm,cls:'due-soon'};
  return {txt:'next '+hhmm,cls:'due-ok'};
}
function freqLabel(h){ if(h==null)return 'q?'; if(h<1)return 'q'+Math.round(h*60)+'m'; return 'q'+(Number.isInteger(h)?h:h)+'h'; }
function taskLine(p,t,i){
  if(t.recurring){
    const d=fmtDue(t);
    const lastTxt=t.last?('last '+new Date(t.last).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})):'—';
    return `<div class="line recur"><span class="recur-ic">↻</span><span class="lt">${t.t} <span class="freq" onclick="event.stopPropagation();editFreq(${p.id},${i})">${freqLabel(t.freq)}</span></span><span class="when">${lastTxt}</span><span class="due ${d.cls}" onclick="logRecurring(${p.id},${i})">${d.txt}</span></div>`;
  }
  return `<div class="line ${t.done?'done':''}"><div class="tick ${t.done?'done':''}" onclick="tick(${p.id},${i})">✓</div><span class="lt">${t.t}</span><span class="owner">${t.o||''}</span><span class="when">${t.w||''}</span></div>`;
}
const FREQ_OPTS=[['0.5','30 min'],['1','1 hrly'],['2','2 hrly'],['3','3 hrly'],['4','4 hrly'],['6','6 hrly'],['8','8 hrly'],['12','12 hrly']];
window.addRecurring=id=>{ if(!guard(id))return;
  const el=$(`#qr${id}`);const v=el.value.trim();if(!v)return;

    <div class="field"><label>✏️ or custom (hours; use 0.5 for 30 min)</label><input id="fqc" type="number" step="0.5" min="0.25" placeholder="e.g. 1.5"></div>
    <button class="go" id="fqsave">Add recurring task</button><button class="go ghost" onclick="closeSheet()">Cancel</button>`);
  let fr=4;
  document.querySelectorAll('#fq .pill').forEach(x=>x.onclick=()=>{document.querySelectorAll('#fq .pill').forEach(y=>y.classList.remove('sel'));x.classList.add('sel');fr=+x.dataset.f;$('#fqc').value='';});
  $('#fqc').oninput=()=>{document.querySelectorAll('#fq .pill').forEach(y=>y.classList.remove('sel'));const c=parseFloat($('#fqc').value);if(c>0)fr=c;};
  $('#fqsave').onclick=()=>{
    p.tasks.push({t:v,recurring:true,freq:fr,last:null,o:shortMe()});

};

/* ===== Identity-verification signals (NEUTRAL prompts, not accusations) =====
   The app knows the account, not the person. These flag patterns a consultant
   may want to eyeball — nothing here proves misuse. */
async function verifySignals(){
  let rows=[];
  if(MODE==='live'){
    try{ const {data}=await db.rpc('recent_checkins'); rows=data||[]; }catch(e){ rows=[]; }
  } else {
    rows=(window.DEMO_VERIFY||[]);
  }
  const flags=[];
  const radius=(WARD_GEO&&WARD_GEO.radius_m)||300;
  const geoOn=WARD_GEO&&WARD_GEO.geo_gate&&WARD_GEO.lat!=null;
  const active=rows.filter(r=>r.active);

  // 1) NEW DEVICE
  active.forEach(a=>{
    if(!a.device_id)return;
    const priors=rows.filter(r=>r.resident_id===a.resident_id && r.id!==a.id);
    if(priors.length>0 && !priors.some(r=>r.device_id===a.device_id)){
      flags.push({who:a.resident_name,bay:a.bay,reason:'New device for this account (first check-in from this phone).'});
    }
  });
  // 2) LOCATION MISMATCH
  if(geoOn){
    active.forEach(a=>{
      if(a.lat==null)return;
      const d=distM(+a.lat,+a.lng,+WARD_GEO.lat,+WARD_GEO.lng);
      if(d>radius) flags.push({who:a.resident_name,bay:a.bay,reason:`Checked in ${Math.round(d)}m from the ward (outside the ${radius}m range).`});
    });
  }
  // 3) IMPOSSIBLE MOVEMENT (>1km in <10min, same account)
  const byRes={};
  rows.forEach(r=>{ if(r.lat!=null){ (byRes[r.resident_id]=byRes[r.resident_id]||[]).push(r); } });
  Object.values(byRes).forEach(list=>{
    list.sort((a,b)=>new Date(a.at)-new Date(b.at));
    for(let i=1;i<list.length;i++){
      const a=list[i-1],b=list[i];
      const km=distM(+a.lat,+a.lng,+b.lat,+b.lng)/1000;
      const mins=(new Date(b.at)-new Date(a.at))/60000;
      if(km>1 && mins<10){ flags.push({who:b.resident_name,bay:b.bay,reason:`Two check-ins ${km.toFixed(1)}km apart within ${Math.round(mins)} min — confirm same person.`}); break; }
    }
  });
  // 4) SHARED DEVICE (2+ accounts, one device, <15min)
  const byDev={};
  rows.forEach(r=>{ if(r.device_id){ (byDev[r.device_id]=byDev[r.device_id]||[]).push(r); } });
  Object.values(byDev).forEach(list=>{
    list.sort((a,b)=>new Date(a.at)-new Date(b.at));
    for(let i=1;i<list.length;i++){
      const a=list[i-1],b=list[i];
      const mins=(new Date(b.at)-new Date(a.at))/60000;
      if(a.resident_id!==b.resident_id && mins<15){
        flags.push({who:b.resident_name,bay:b.bay,reason:`Same phone used by ${a.resident_name} then ${b.resident_name} within ${Math.round(mins)} min.`});
        break;
      }
    }
  });
  const seen=new Set(); return flags.filter(f=>{const k=f.who+'|'+f.reason;if(seen.has(k))return false;seen.add(k);return true;});
}
function portalData(){
  const sick=P.filter(p=>p.sev==='sick').sort((a,b)=>b.news-a.news);
  const esc=P.filter(p=>p.esc);
  const openTasks=[]; P.forEach(p=>p.tasks.filter(t=>!t.done&&!t.recurring).forEach(t=>openTasks.push({p,t})));
  const overdue=[]; P.forEach(p=>p.tasks.filter(t=>t.recurring&&t.last&&fmtDue(t).cls==='due-over').forEach(t=>overdue.push({p,t})));
  const pendLabs=[]; P.forEach(p=>p.labs.filter(l=>l.s==='pending').forEach(l=>pendLabs.push({p,l})));
  const cons=wardConsultant();
  const gaps=BAYS.filter(b=>P.some(p=>p.bay===b.id) && traineesIn(b.id).length===0);
  return {sick,esc,openTasks,overdue,pendLabs,cons,gaps};
}

function shiftStartISO(){
  // start of the current shift window
  const now=new Date(); const h=now.getHours(); const d=new Date(now);
  let sh;
  if(h>=7&&h<15)sh=7; else if(h>=15&&h<21)sh=15; else sh=21;
  if(h<7){ d.setDate(d.getDate()-1); sh=21; }  // early morning belongs to last night's shift
  d.setHours(sh,0,0,0);
  return d.toISOString();
}

async function myCheckin(){
  if(MODE!=='live') return CHECKINS.find(c=>c.resident_id===(MYUID||'me') && c.active!==false)||null;
  try{ const {data}=await db.from('checkins').select('*').eq('resident_id',MYUID).eq('active',true).maybeSingle(); return data; }
  catch(e){ return null; }
}
window.checkIn=async(bay)=>{
  const shift=(SHIFT||currentShift());
  if(MODE!=='live'){
    // demo mirror of server rules
    MYUID='me';
    CHECKINS=CHECKINS.filter(c=>c.resident_id!=='me');           // clear my own
    if(ROLE==='consultant'){
      CHECKINS=CHECKINS.filter(c=>c.role!=='consultant');        // one consultant/shift
      CHECKINS.push({id:Date.now(),resident_id:'me',resident_name:ME,role:'consultant',bay:'*',shift_tag:shift,active:true});
      toast('Checked in as ward consultant ('+shift+')');
    }else{
      CHECKINS=CHECKINS.filter(c=>!(c.role!=='consultant' && c.bay===bay)); // hand off other trainee in this bay
      CHECKINS.push({id:Date.now(),resident_id:'me',resident_name:ME,role:'trainee',bay,shift_tag:shift,active:true});
      sel=bay; toast('Checked into '+(BAYS.find(b=>b.id===bay)?.name||bay));
    }
    closeSheet(); renderBays(); renderList(); renderDuty(); return;
  }
  try{
    const {data:ws}=await db.from('ward_settings').select('*').eq('id',1).single();
    let lat=null,lng=null;
    if(ws && ws.geo_gate && ws.lat!=null){
      const pos=await getPos();
      if(!pos){ toast('Location needed to check in',true); return; }
      const d=distM(pos.lat,pos.lng,+ws.lat,+ws.lng);
      if(d>(ws.radius_m||300)){ toast(`Too far from ward (${Math.round(d)}m) to check in`,true); return; }
      lat=pos.lat; lng=pos.lng;
    } else { const pos=await getPos().catch(()=>null); if(pos){lat=pos.lat;lng=pos.lng;} }
    // server handles consultant vs trainee + hand-off + shift stamping
    const {error}=await db.rpc('check_in',{p_bay:bay,p_shift_tag:shift,p_shift_date:shiftDate(),p_lat:lat,p_lng:lng,p_device_id:deviceId(),p_user_agent:shortUA()});
    if(error){ toast('Check-in failed: '+error.message,true); return; }
    if(ROLE!=='consultant')sel=bay;
    await loadCheckins(); closeSheet(); renderBays(); renderList(); renderDuty();
    toast(ROLE==='consultant'?('Checked in as ward consultant ('+shift+')'):('Checked into '+(BAYS.find(b=>b.id===bay)?.name||bay)));
  }catch(e){ toast('Check-in error',true); }
};
window.checkOut=async(cid)=>{
  if(MODE!=='live'){ CHECKINS=CHECKINS.filter(c=>c.id!==cid); closeSheet(); renderBays(); renderList(); renderDuty(); toast('Checked out'); return; }
  const {error}=await db.from('checkins').update({active:false}).eq('id',cid);
  if(error){ toast('Check-out failed',true); return; }
  await loadCheckins(); closeSheet(); renderBays(); renderList(); renderDuty(); toast('Checked out');
};
function getPos(){ return new Promise(res=>{ if(!navigator.geolocation)return res(null); navigator.geolocation.getCurrentPosition(p=>{LAST_POS={lat:p.coords.latitude,lng:p.coords.longitude,at:Date.now()};res(LAST_POS);},()=>res(null),{timeout:8000,enableHighAccuracy:true}); }); }
// stable per-device id (persists in this browser). Used only to flag
// "new device" / "shared device" for identity verification — never to track.
function deviceId(){
  try{
    let d=localStorage.getItem('nig_device');
    if(!d){ d='dev_'+Math.random().toString(36).slice(2)+Date.now().toString(36); localStorage.setItem('nig_device',d); }
    return d;
  }catch(e){ return 'dev_unknown'; }
}
function shortUA(){ const u=navigator.userAgent||''; const m=u.match(/(iPhone|iPad|Android|Windows|Macintosh|Linux)[^;)]*/); return (m?m[0]:'device').slice(0,40); }
// how far the doctor currently is from the ward (metres), or null if unknown/off
function wardDistance(){
  if(!WARD_GEO || !WARD_GEO.geo_gate || WARD_GEO.lat==null || !LAST_POS) return null;
  return distM(LAST_POS.lat,LAST_POS.lng,+WARD_GEO.lat,+WARD_GEO.lng);
}
function farFromWard(){ const d=wardDistance(); return d!=null && d>((WARD_GEO&&WARD_GEO.radius_m)||300) ? Math.round(d) : null; }
function distM(a,b,c,d){const R=6371000,t=x=>x*Math.PI/180;const dφ=t(c-a),dλ=t(d-b);const A=Math.sin(dφ/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(dλ/2)**2;return 2*R*Math.asin(Math.sqrt(A));}

/* ---------------- auth ---------------- */
let authUser=null, gateMode='signin';
const gEl={name:$('#fName'),email:$('#fEmail'),pass:$('#fPass'),invite:$('#fInvite'),
  btn:$('#gateBtn'),hint:$('#gateHint'),title:$('#gateTitle'),sub:$('#gateSub'),swap:$('#gateSwap'),link:$('#swapLink')};

function gateHint(msg,bad){ gEl.hint.textContent=msg||''; gEl.hint.style.color=bad?'var(--sick)':'var(--mut)'; }
function setGateMode(m){
  gateMode=m;
  const signup = m==='signup';
  gEl.name.style.display   = signup?'block':'none';
  gEl.invite.style.display = signup?'block':'none';
  gEl.pass.setAttribute('autocomplete', signup?'new-password':'current-password');
  gEl.title.textContent = signup?'Create account':'Nigehbān';
  gEl.sub.textContent   = signup?'Register your resident account to join the ward.':'Har shift, ek nigehbān — sign in with your resident email.';
  gEl.btn.textContent   = signup?'Create account':'Sign in';
  gEl.swap.innerHTML    = signup?'Already registered? <a id="swapLink">Sign in</a>':'New here? <a id="swapLink">Create an account</a>';
  $('#swapLink').onclick = ()=>setGateMode(signup?'signin':'signup');
  gateHint('');
}
gEl.link.onclick=()=>setGateMode('signup');

async function doAuth(){
  const email=gEl.email.value.trim(), pass=gEl.pass.value;
  if(!email||!pass){ gateHint('Enter email and password.',true); return; }
  gEl.btn.disabled=true; gEl.btn.style.opacity=.6;
  try{
    if(gateMode==='signup'){
      const code=gEl.invite.value.trim();
      let signupRole=null;
      if(code===CONFIG.CONSULTANT_INVITE) signupRole='consultant';
      else if(code===CONFIG.WARD_INVITE) signupRole='trainee';
      else { gateHint('Wrong invite code.',true); return; }
      const name=gEl.name.value.trim()||email;
      const {data,error}=await db.auth.signUp({email,password:pass,options:{data:{full_name:name,role:signupRole}}});
      if(error)throw error;
      if(data.session){ onSignedIn(data.session); }         // signups w/o email confirmation
      else { gateHint(`Account created${signupRole==='consultant'?' as consultant':''}. Check your email to confirm, then sign in.`); setGateMode('signin'); }
    }else{
      const {data,error}=await db.auth.signInWithPassword({email,password:pass});
      if(error)throw error;
      onSignedIn(data.session);
    }
  }catch(e){
    gateHint(e.message||'Authentication failed.',true);
  }finally{
    gEl.btn.disabled=false; gEl.btn.style.opacity=1;
  }
}
gEl.btn.onclick=doAuth;
[gEl.email,gEl.pass,gEl.invite].forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter')doAuth();}));

async function onSignedIn(session){
  authUser=session.user; MYUID=session.user.id;
  ME = (session.user.user_metadata && session.user.user_metadata.full_name) || session.user.email;
  SHIFT=currentShift();
  $('#gate').style.display='none'; $('#app').style.display='flex';
  // fetch role
  try{
    const {data}=await db.from('residents').select('role').eq('id',MYUID).single();
    if(data&&data.role)ROLE=data.role;
  }catch(e){ ROLE='trainee'; }
  if(ROLE==='consultant'){ const np=$('#navPortal'); if(np)np.style.display=''; }
  boot();
}

/* ---------------- startup ---------------- */
(async function start(){
  if(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON && window.supabase){
    db=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON);
    setGateMode('signin');
    const {data:{session}}=await db.auth.getSession();
    if(session){ onSignedIn(session); }        // already logged in → skip gate
    // else: show login gate (already visible)
  }else{
    // no keys → demo mode, no login required
    setGateMode('signin');
    $('#gate').style.display='none'; $('#app').style.display='flex';
    ME='Demo user'; ROLE='consultant'; SHIFT=currentShift(); const np=$('#navPortal'); if(np)np.style.display=''; boot();
  }
})();
</script>
